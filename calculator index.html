<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator | Hemang Chouhan</title>

    <link rel="stylesheet" href="calculaotor.style.css.css">
</head>

<body>

    <main class="calculator">

        <div class="top">
            <h1>Calculator</h1>
            <span>HCode.</span>
        </div>

        <div class="display">
            <div id="history"></div>
            <div id="result">0</div>
        </div>

        <div class="buttons">

            <button class="operator" onclick="clearDisplay()">AC</button>
            <button class="operator" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="percentage()">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="number('7')">7</button>
            <button onclick="number('8')">8</button>
            <button onclick="number('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="number('4')">4</button>
            <button onclick="number('5')">5</button>
            <button onclick="number('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="number('1')">1</button>
            <button onclick="number('2')">2</button>
            <button onclick="number('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="number('0')">0</button>
            <button onclick="number('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

        <p class="credit">
            Built with HTML • CSS • JavaScript
        </p>

    </main>

    <script src="calculator.js.script.js"></script>

</body>
</html>
